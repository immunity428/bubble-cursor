<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Bubble Cursor</title>
<style>
  :root {
    --ink: #1E2533;
    --muted: #687083;
    --line: #DCE3F0;
    --surface: #F3F6FC;
    --blue: #3D6FD8;
    --blue-deep: #2554BE;
    --bubble: rgba(61, 111, 216, .16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 300px; padding: 16px;
    font: 13px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    color: var(--ink); background: #fff;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }

  .preview {
    display: block; width: 100%; height: 120px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line); cursor: crosshair;
  }
  .caption { margin: 6px 0 14px; color: var(--muted); font-size: 12px; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row label { cursor: pointer; }
  .radius { display: block; }
  .radius-head { display: flex; justify-content: space-between; align-items: baseline; }
  .radius-value { font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type="range"] { width: 100%; margin: 6px 0 4px; accent-color: var(--blue); }
  input[type="range"]:disabled { opacity: .4; }
  .check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .check input { accent-color: var(--blue); margin: 0; }

  /* スイッチ */
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: #C9D0DC;
    transition: background .15s; pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch input:checked + span { background: var(--blue); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--blue-deep); outline-offset: 2px; }

  body.off .preview, body.off .settings { opacity: .45; }

  footer { margin-top: 12px; color: var(--muted); font-size: 12px; }
  footer p { margin: 0; }
  kbd {
    font: inherit; font-size: 11px; padding: 0 4px; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; background: #fff; color: var(--ink);
  }
  @media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none; } }
</style>
</head>
<body>
  <header>
    <h1>Bubble Cursor</h1>
    <div class="switch" title="オン/オフ">
      <input type="checkbox" id="enabled" aria-label="Bubble Cursor を有効にする">
      <span></span>
    </div>
  </header>

  <svg class="preview" id="preview" viewBox="0 0 268 120" aria-label="バブルカーソルの動きを試せるエリア"></svg>
  <p class="caption">枠の中でマウスを動かすと、バブルの大きさが変わる様子を試せます</p>

  <div class="settings">
    <div class="row">
      <label for="showBubble">バブルを表示</label>
      <div class="switch">
        <input type="checkbox" id="showBubble">
        <span></span>
      </div>
    </div>
    <div class="row radius">
      <div class="radius-head">
        <label for="maxRadius">最大半径</label>
        <span class="radius-value" id="radiusValue">200px</span>
      </div>
      <input type="range" id="maxRadius" min="40" max="600" step="10" value="200">
      <label class="check"><input type="checkbox" id="unlimited">上限なし（論文と同じ動き）</label>
    </div>
  </div>

  <footer>
    <p><kbd>Alt</kbd> を押している間は普通のカーソルになります</p>
    <p id="shortcut"></p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
